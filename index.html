<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Multi-Game Casino Arena</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #090d16;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .app-card {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            border: 2px solid #f59e0b;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);
            padding: 15px;
            text-align: center;
            position: relative;
        }
        .header h1 {
            color: #fbbf24;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            margin-bottom: 5px;
        }
        /* VIP & Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #020617;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            margin-bottom: 8px;
            border: 1px solid #1e293b;
        }
        .vip-badge { color: #f59e0b; font-weight: bold; }
        .balance-box {
            background: #0284c7;
            padding: 8px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-daily {
            background: #10b981;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            color: #fff;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }
        /* Navigation Tabs */
        .game-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            background: #020617;
            padding: 4px;
            border-radius: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #f59e0b;
            color: #000;
        }
        .game-panel {
            display: none;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px;
            min-height: 230px;
        }
        .game-panel.active {
            display: block;
        }
        .input-group {
            margin-bottom: 8px;
            text-align: left;
        }
        .input-group label {
            font-size: 0.7rem;
            color: #94a3b8;
            display: block;
            margin-bottom: 2px;
        }
        .input-group input {
            width: 100%;
            padding: 7px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }
        .btn-main {
            width: 100%;
            padding: 10px;
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
        }
        .result-text {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 22px;
            color: #4ade80;
        }
        /* Mines Grid */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin: 8px 0;
        }
        .mine-cell {
            aspect-ratio: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .mine-cell.revealed { background: #0f172a; border-color: #475569; }
        .mine-cell.gem { color: #4ade80; }
        .mine-cell.boom { color: #f87171; }
        /* Color Buttons */
        .color-btns {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .color-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            font-size: 0.85rem;
        }
        .btn-green { background: #10b981; }
        .btn-violet { background: #8b5cf6; }
        .btn-red { background: #ef4444; }
        /* Live Leaderboard Ticker */
        .leaderboard-ticker {
            margin-top: 10px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 6px;
            font-size: 0.7rem;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>ADVANCED CASINO ARENA</h1>
    </div>

    <!-- VIP & Stats Header -->
    <div class="stats-bar">
        <span>VIP: <span id="vipTier" class="vip-badge">Bronze</span></span>
        <span>XP: <span id="xpCount">0</span>/500</span>
    </div>

    <div class="balance-box">
        <span>Balance: $<span id="balance">1000</span></span>
        <button class="btn-daily" onclick="claimDailyBonus()">Daily Bonus</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="game-tabs">
        <button class="tab-btn active" onclick="switchTab('crash')">🚀 Crash</button>
        <button class="tab-btn" onclick="switchTab('mines')">💣 Mines</button>
        <button class="tab-btn" onclick="switchTab('color')">🎯 Color</button>
    </div>

    <!-- Game 1: Crash -->
    <div id="crash-panel" class="game-panel active">
        <div style="font-size: 1.8rem; color: #fbbf24; margin: 10px 0; font-weight: bold;" id="crashMultiplier">1.00x</div>
        <div class="input-group">
            <label>Bet Amount ($)</label>
            <input type="number" id="crashBet" value="50">
        </div>
        <button class="btn-main" id="crashBtn" onclick="startCrashGame()">START FLIGHT</button>
        <div class="result-text" id="crashResult">Place bet & start rocket!</div>
    </div>

    <!-- Game 2: Mines -->
    <div id="mines-panel" class="game-panel">
        <div class="input-group">
            <label>Bet Amount ($)</label>
            <input type="number" id="minesBet" value="50">
        </div>
        <button class="btn-main" id="minesStartBtn" onclick="startMinesGame()">START MINES</button>
        <div class="mines-grid" id="minesGrid"></div>
        <div class="result-text" id="minesResult">Click start to play Mines!</div>
    </div>

    <!-- Game 3: Color Prediction -->
    <div id="color-panel" class="game-panel">
        <div class="input-group">
            <label>Bet Amount ($)</label>
            <input type="number" id="colorBet" value="50">
        </div>
        <label style="font-size:0.7rem; color:#94a3b8; display:block; text-align:left; margin-bottom:4px;">Select Color (Green 2X | Violet 4.5X | Red 2X)</label>
        <div class="color-btns">
            <button class="color-btn btn-green" onclick="playColor('green')">Green</button>
            <button class="color-btn btn-violet" onclick="playColor('violet')">Violet</button>
            <button class="color-btn btn-red" onclick="playColor('red')">Red</button>
        </div>
        <div class="result-text" id="colorResult">Pick a color to predict!</div>
    </div>

    <!-- Live Leaderboard Ticker -->
    <div class="leaderboard-ticker" id="tickerText">
        🏆 Live Wins: Player_77 won $450 | Alex_99 won $1,200 | Zeeshan won $300
    </div>
</div>

<script>
    // --- State & LocalStorage Management ---
    let balance = parseInt(localStorage.getItem("casino_balance")) || 1000;
    let xp = parseInt(localStorage.getItem("casino_xp")) || 0;
    let lastClaimTime = parseInt(localStorage.getItem("casino_last_claim")) || 0;

    function saveState() {
        localStorage.setItem("casino_balance", balance);
        localStorage.setItem("casino_xp", xp);
        localStorage.setItem("casino_last_claim", lastClaimTime);
        updateUI();
    }

    function updateUI() {
        document.getElementById("balance").innerText = balance;
        document.getElementById("xpCount").innerText = xp;
        
        let tier = "Bronze";
        if (xp >= 2000) tier = "VIP Diamond";
        else if (xp >= 1000) tier = "Gold";
        else if (xp >= 500) tier = "Silver";
        document.getElementById("vipTier").innerText = tier;
    }

    function addXP(amount) {
        xp += amount;
        saveState();
    }

    // --- Web Audio API Sound Engine ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        if (type === 'win') {
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'loss') {
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'click') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
    }

    // --- Daily Bonus System ---
    function claimDailyBonus() {
        playSound('click');
        let now = Date.now();
        if (now - lastClaimTime < 86400000) {
            alert("Daily bonus already claimed! Come back tomorrow.");
            return;
        }
        lastClaimTime = now;
        balance += 250;
        saveState();
        alert("🎉 Successfully claimed $250 Daily Bonus!");
    }

    function switchTab(tabName) {
        playSound('click');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));

        if(tabName === 'crash') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('crash-panel').classList.add('active');
        } else if(tabName === 'mines') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('mines-panel').classList.add('active');
            initMinesGrid(false);
        } else if(tabName === 'color') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('color-panel').classList.add('active');
        }
    }

    // --- 1. Crash Game ---
    let crashInterval = null;
    let currentMultiplier = 1.00;
    let isCrashing = false;

    function startCrashGame() {
        playSound('click');
        if(isCrashing) {
            clearInterval(crashInterval);
            let bet = parseInt(document.getElementById("crashBet").value);
            let winnings = Math.floor(bet * currentMultiplier);
            balance += winnings;
            addXP(Math.floor(bet / 5));
            playSound('win');
            document.getElementById("crashResult").innerHTML = `<span style="color:#4ade80;">Cashed out at ${currentMultiplier.toFixed(2)}x! Won $${winnings}</span>`;
            document.getElementById("crashBtn").innerText = "START FLIGHT";
            isCrashing = false;
            saveState();
            return;
        }

        let bet = parseInt(document.getElementById("crashBet").value);
        if(isNaN(bet) || bet <= 0 || bet > balance) {
            document.getElementById("crashResult").innerText = "Invalid bet amount!";
            return;
        }

        balance -= bet;
        saveState();
        isCrashing = true;
        currentMultiplier = 1.00;
        document.getElementById("crashBtn").innerText = "CASHOUT";
        document.getElementById("crashResult").innerText = "Rocket flying...";

        let crashPoint = (Math.random() * 3 + 1.1).toFixed(2);

        crashInterval = setInterval(() => {
            currentMultiplier += 0.05;
            document.getElementById("crashMultiplier").innerText = currentMultiplier.toFixed(2) + "x";

            if(currentMultiplier >= parseFloat(crashPoint)) {
                clearInterval(crashInterval);
                isCrashing = false;
                playSound('loss');
                document.getElementById("crashBtn").innerText = "START FLIGHT";
                document.getElementById("crashResult").innerHTML = `<span style="color:#f87171;">CRASHED at ${crashPoint}x! Lost $${bet}</span>`;
            }
        }, 150);
    }

    // --- 2. Mines Game ---
    let minePosition = -1;
    let minesActive = false;

    function initMinesGrid(clickable) {
        const grid = document.getElementById("minesGrid");
        grid.innerHTML = "";
        for(let i=0; i<12; i++) {
            let cell = document.createElement("div");
            cell.className = "mine-cell";
            cell.innerText = "?";
            if(clickable) {
                cell.onclick = () => handleMineClick(i, cell);
            }
            grid.appendChild(cell);
        }
    }

    function startMinesGame() {
        playSound('click');
        let bet = parseInt(document.getElementById("minesBet").value);
        if(isNaN(bet) || bet <= 0 || bet > balance) {
            document.getElementById("minesResult").innerText = "Invalid bet amount!";
            return;
        }
        balance -= bet;
        saveState();
        minesActive = true;
        minePosition = Math.floor(Math.random() * 12);
        initMinesGrid(true);
        document.getElementById("minesResult").innerText = "Choose a tile carefully!";
    }

    function handleMineClick(index, cell) {
        if(!minesActive) return;
        minesActive = false;
        let bet = parseInt(document.getElementById("minesBet").value);

        if(index === minePosition) {
            cell.classList.add('revealed', 'boom');
            cell.innerText = "💣";
            playSound('loss');
            document.getElementById("minesResult").innerHTML = `<span style="color:#f87171;">Boom! You hit a mine. Lost $${bet}</span>`;
        } else {
            cell.classList.add('revealed', 'gem');
            cell.innerText = "💎";
            let reward = bet * 2;
            balance += reward;
            addXP(Math.floor(bet / 4));
            playSound('win');
            saveState();
            document.getElementById("minesResult").innerHTML = `<span style="color:#4ade80;">Safe! Won $${reward}</span>`;
        }
    }

    // --- 3. Color Prediction Game ---
    function playColor(choice) {
        playSound('click');
        let bet = parseInt(document.getElementById("colorBet").value);
        if(isNaN(bet) || bet <= 0 || bet > balance) {
            document.getElementById("colorResult").innerText = "Invalid bet amount!";
            return;
        }

        balance -= bet;
        saveState();

        const colorsList = ['green', 'green', 'red', 'red', 'violet'];
        let outcome = colorsList[Math.floor(Math.random() * colorsList.length)];

        if(choice === outcome) {
            let multiplier = (outcome === 'violet') ? 4.5 : 2.0;
            let win = Math.floor(bet * multiplier);
            balance += win;
            addXP(Math.floor(bet / 3));
            playSound('win');
            saveState();
            document.getElementById("colorResult").innerHTML = `<span style="color:#4ade80;">Outcome: ${outcome.toUpperCase()}! Won $${win}</span>`;
        } else {
            playSound('loss');
            document.getElementById("colorResult").innerHTML = `<span style="color:#f87171;">Outcome: ${outcome.toUpperCase()}. You lost!</span>`;
        }
    }

    // Simulated Live Leaderboard Ticker updates
    const tickerNames = ["Zeeshan", "Bilal", "Ali_99", "Hamza_X", "Khan_Pro", "Ahmed_786"];
    setInterval(() => {
        let randomName = tickerNames[Math.floor(Math.random() * tickerNames.length)];
        let randomWin = Math.floor(Math.random() * 1500) + 100;
        document.getElementById("tickerText").innerText = `🏆 Live Wins: ${randomName} just won $${randomWin} in Crash!`;
    }, 5000);

    updateUI();
    initMinesGrid(false);
</script>

</body>
</html>
