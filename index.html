<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Pro Ludo Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .ludo-container {
            width: 100%;
            max-width: 450px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 2px solid #f59e0b;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
            padding: 15px;
            text-align: center;
        }
        .header h1 {
            color: #fbbf24;
            font-size: 1.3rem;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }
        .status-bar {
            background: #020617;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid #1e293b;
        }
        /* Simplified 2-Player Ludo Board Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            background: #0f172a;
            padding: 8px;
            border-radius: 12px;
            border: 2px solid #334155;
            margin-bottom: 12px;
        }
        .cell {
            aspect-ratio: 1;
            background: #1e293b;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            font-weight: bold;
            position: relative;
        }
        .cell.safe { background: #334155; }
        .cell.red-home { background: rgba(239, 68, 68, 0.3); border: 1px solid #ef4444; }
        .cell.green-home { background: rgba(16, 185, 129, 0.3); border: 1px solid #10b981; }

        /* Pawns */
        .pawn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            cursor: pointer;
            border: 2px solid #fff;
        }
        .pawn-red { background: #ef4444; }
        .pawn-green { background: #10b981; }

        .control-panel {
            background: #020617;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .dice-box {
            font-size: 2rem;
            background: #1e293b;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #f59e0b;
            color: #fbbf24;
        }
        .btn-roll {
            padding: 10px 20px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
        }
        .btn-roll:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="ludo-container">
    <div class="header">
        <h1>CLASSIC LUDO ARENA</h1>
    </div>
    
    <div class="status-bar" id="statusText">
        Player Red's Turn (Click Roll Dice)
    </div>

    <!-- Ludo Board (7x7 Track Layout for Quick 2-Player Match) -->
    <div class="board" id="ludoBoard">
        <!-- Dynamically generated board cells -->
    </div>

    <div class="control-panel">
        <div>
            <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 3px;">DICE</div>
            <div class="dice-box" id="diceDisplay">🎲</div>
        </div>
        <button class="btn-roll" id="rollBtn" onclick="rollDice()">ROLL DICE</button>
    </div>
</div>

<script>
    // 2-Player Simplified Track Setup (0 to 23 track index)
    // Red starts at 0, Green starts at 12
    let turn = 'red'; // 'red' or 'green'
    let diceValue = 0;
    let hasRolled = false;

    // Pawns data: each player has 2 pawns (-1 means inside base, 0-23 track position, 24 means home)
    let redPawns = [-1, -1];
    let greenPawns = [-1, -1];

    function renderBoard() {
        const board = document.getElementById("ludoBoard");
        board.innerHTML = "";

        // Create 21 Track Cells
        for (let i = 0; i < 21; i++) {
            let cell = document.createElement("div");
            cell.className = "cell";
            if(i === 0) cell.classList.add("red-home");
            if(i === 10) cell.classList.add("green-home");
            if(i === 5 || i === 15) cell.classList.add("safe");
            cell.innerText = i;

            // Check if any Red pawn is here
            redPawns.forEach((pos, idx) => {
                if(pos === i) {
                    let p = document.createElement("div");
                    p.className = "pawn pawn-red";
                    p.onclick = () => movePawn('red', idx);
                    cell.appendChild(p);
                }
            });

            // Check if any Green pawn is here
            greenPawns.forEach((pos, idx) => {
                if(pos === i) {
                    let p = document.createElement("div");
                    p.className = "pawn pawn-green";
                    p.onclick = () => movePawn('green', idx);
                    cell.appendChild(p);
                }
            });

            board.appendChild(cell);
        }
    }

    function rollDice() {
        if(hasRolled) return;
        diceValue = Math.floor(Math.random() * 6) + 1;
        document.getElementById("diceDisplay").innerText = diceValue;
        hasRolled = true;

        document.getElementById("statusTextinnerText") = `Rolled a ${diceValue}. Click your pawn to move!`;
        
        // Auto check if player has any valid moves, otherwise switch turn
        let validMoves = getValidMoves(turn);
        if(validMoves === 0) {
            setTimeout(() => {
                switchTurn();
            }, 1200);
        }
    }

    function getValidMoves(player) {
        let pawns = player === 'red' ? redPawns : greenPawns;
        let count = 0;
        pawns.forEach(pos => {
            if(pos === -1 && diceValue === 6) count++;
            if(pos !== -1 && pos + diceValue <= 20) count++;
        });
        return count;
    }

    function movePawn(player, index) {
        if(!hasRolled || player !== turn) return;
        let pawns = player === 'red' ? redPawns : greenPawns;
        let pos = pawns[index];

        if(pos === -1) {
            if(diceValue === 6) {
                pawns[index] = player === 'red' ? 0 : 10; // Start position
                finishTurn();
            } else {
                alert("You need a 6 to open a pawn!");
            }
        } else {
            let newPos = pos + diceValue;
            if(newPos <= 20) {
                pawns[index] = newPos;
                
                // Check win condition
                if(newPos === 20) {
                    alert(`🎉 Player ${player.toUpperCase()} won a pawn home!`);
                }

                finishTurn();
            } else {
                alert("Exact count needed to reach home!");
            }
        }
    }

    function finishTurn() {
        hasRolled = false;
        switchTurn();
    }

    function switchTurn() {
        turn = turn === 'red' ? 'green' : 'red';
        document.getElementById("statusText").innerText = `Player ${turn.toUpperCase()}'s Turn (Roll Dice)`;
        document.getElementById("diceDisplay").innerText = "🎲";
        renderBoard();
    }

    renderBoard();
</script>

</body>
</html>
