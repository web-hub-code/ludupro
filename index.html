<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Slot & Wheel Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #090d16;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
            border: 2px solid #f59e0b;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            color: #fbbf24;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }
        .balance-box {
            background: #0284c7;
            padding: 10px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
        }
        canvas {
            background: #020617;
            border-radius: 50%;
            border: 4px solid #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            margin: 10px 0;
        }
        .controls {
            margin-top: 15px;
        }
        .btn-spin {
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: transform 0.1s;
        }
        .btn-spin:active {
            transform: scale(0.98);
        }
        .result {
            margin-top: 15px;
            font-size: 1.1rem;
            min-height: 30px;
            color: #4ade80;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>WHEEL SPIN SIMULATION</h1>
    </div>

    <div class="balance-box">
        Balance: $<span id="balance">1000</span>
    </div>

    <!-- Animated Wheel Canvas -->
    <canvas id="wheelCanvas" width="260" height="260"></canvas>

    <div class="controls">
        <button class="btn-spin" onclick="spinWheel()">SPIN ($50)</button>
    </div>

    <div class="result" id="statusText">Press SPIN to start!</div>
</div>

<script>
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    
    const segments = ["100", "200", "500", "0", "1000", "50", "2000", "0"];
    const colors = ["#ef4444", "#3b82f6", "#10b981", "#6b7280", "#f59e0b", "#8b5cf6", "#ec4899", "#475569"];
    
    let currentAngle = 0;
    let isSpinning = false;
    let balance = 1000;

    function drawWheel() {
        const numSegments = segments.length;
        const arcSize = (2 * Math.PI) / numSegments;
        const radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(currentAngle);

        for (let i = 0; i < numSegments; i++) {
            const angle = i * arcSize;
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, angle, angle + arcSize);
            ctx.lineTo(0, 0);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#0f172a";
            ctx.stroke();

            // Text Rendering
            ctx.save();
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px Segoe UI";
            ctx.fillText("$" + segments[i], radius - 15, 5);
            ctx.restore();
        }

        ctx.restore();

        // Pointer Arrow (Top)
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.moveTo(radius - 12, 5);
        ctx.lineTo(radius + 12, 5);
        ctx.lineTo(radius, 25);
        ctx.fill();
    }

    function spinWheel() {
        if (isSpinning) return;
        if (balance < 50) {
            document.getElementById("statusText").innerText = "Insufficient balance!";
            return;
        }

        balance -= 50;
        document.getElementById("balance").innerText = balance;
        isSpinning = true;
        document.getElementById("statusText").innerText = "Spinning...";

        const spinAngle = Math.random() * 10 + 25; // Random velocity
        let speed = spinAngle * (Math.PI / 180);

        function animate() {
            if (speed > 0.002) {
                currentAngle += speed;
                speed *= 0.985; // Deceleration
                drawWheel();
                requestAnimationFrame(animate);
            } else {
                isSpinning = false;
                calculatePrize();
            }
        }
        animate();
    }

    function calculatePrize() {
        const numSegments = segments.length;
        const arcSize = (2 * Math.PI) / numSegments;

        // Normalize angle relative to top pointer
        let normalizedAngle = (1.5 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
        if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

        const index = Math.floor(normalizedAngle / arcSize);
        const prize = parseInt(segments[index]);

        if (prize > 0) {
            balance += prize;
            document.getElementById("statusText").innerText = `🎉 You won $${prize}!`;
        } else {
            document.getElementById("statusText").innerText = "❌ Better luck next time!";
        }
        document.getElementById("balance").innerText = balance;
    }

    drawWheel();
</script>

</body>
</html>
