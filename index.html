<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yalla Pro Ludo - Enterprise Edition</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:radial-gradient(circle at center,#090d16 0%,#02040a 100%);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}
.app-container{width:100%;max-width:440px;background:rgba(15,23,42,.95);backdrop-filter:blur(30px);border:1px solid rgba(56,189,248,0.2);border-radius:32px;box-shadow:0 30px 60px rgba(0,0,0,.9),0 0 50px rgba(56,189,248,0.1);padding:14px;text-align:center;position:relative;overflow:hidden;min-height:750px;display:flex;flex-direction:column;justify-content:space-between}

/* Top Header Profile Bar */
.top-profile-bar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(30,41,59,0.9),rgba(15,23,42,0.9));padding:8px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.08)}
.user-info{display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#0284c7);display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:0.9rem;border:2px solid #38bdf8}
.user-details{text-align:left}
.user-name{font-size:0.8rem;font-weight:bold;color:#f8fafc}
.user-level{font-size:0.65rem;color:#38bdf8}

.currency-badges{display:flex;gap:6px}
.badge{background:rgba(0,0,0,0.4);padding:4px 8px;border-radius:12px;font-size:0.75rem;font-weight:bold;display:flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,0.05)}
.badge.coins{color:#fbbf24;border-color:rgba(251,191,36,0.3)}
.badge.gems{color:#38bdf8;border-color:rgba(56,189,248,0.3)}

/* Main Content Area */
.main-content{flex-grow:1;display:flex;flex-direction:column;justify-content:center;align-items:center;margin:10px 0}
.board{width:100%;aspect-ratio:1;background:#e2e8f0;border:4px solid #1e293b;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);gap:1px;border-radius:16px;box-shadow:0 15px 35px rgba(0,0,0,.7)}
.cell{background:#fff;display:flex;justify-content:center;align-items:center;position:relative;font-size:.55rem}
.cell.red-base{background:#ef4444}
.cell.yellow-base{background:#f59e0b}
.cell.safe{background:#f1f5f9}
.cell.center-home{background:#6366f1}

.pawn{width:80%;height:80%;border-radius:50%;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.6);border:2px solid #fff;z-index:10}
.pawn-red{background:radial-gradient(circle at 30% 30%,#f87171,#dc2626)}
.pawn-yellow{background:radial-gradient(circle at 30% 30%,#facc15,#d97706)}

/* Game Control Bar */
.game-control-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(30,41,59,0.7);padding:10px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.05);margin-bottom:10px}
.dice-box{font-size:1.6rem;background:#0f172a;width:42px;height:42px;border-radius:12px;display:flex;justify-content:center;align-items:center;border:2px solid #38bdf8;color:#38bdf8}
.btn-roll{padding:8px 20px;background:linear-gradient(135deg,#38bdf8 0%,#0284c7 100%);border:none;border-radius:14px;color:#000;font-weight:bold;font-size:0.85rem;cursor:pointer;box-shadow:0 4px 15px rgba(56,189,248,0.4)}

/* Bottom Navigation Tabs */
.bottom-nav{display:flex;justify-content:space-around;background:rgba(15,23,42,0.9);padding:8px;border-radius:20px;border:1px solid rgba(255,255,255,0.05)}
.nav-item{background:none;border:none;color:#94a3b8;font-size:0.75rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:0.2s}
.nav-item.active{color:#38bdf8}
.nav-item span{font-size:1.1rem}

/* Modals */
.modal{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(9,13,22,0.95);backdrop-filter:blur(20px);border-radius:32px;z-index:300;padding:24px;flex-direction:column;justify-content:center;align-items:center}
.auth-input{width:100%;padding:12px;margin-bottom:12px;background:rgba(30,41,59,0.9);border:1px solid #334155;border-radius:14px;color:#fff;font-size:0.9rem}
</style>
</head>
<body>

<div class="app-container">

<!-- TOP PROFILE BAR -->
<div class="top-profile-bar">
<div class="user-info">
<div class="avatar" id="userAvatar">YP</div>
<div class="user-details">
<div class="user-name" id="userNameDisplay">Guest Player</div>
<div class="user-level">⭐ VIP Level 1</div>
</div>
</div>
<div class="currency-badges">
<div class="badge coins"><span id="coinsCount">5,000</span> 🪙</div>
<div class="badge gems"><span id="gemsCount">200</span> 💎</div>
</div>
</div>

<!-- MAIN CONTENT / BOARD -->
<div class="main-content">
<div class="board" id="ludoBoard"></div>
</div>

<!-- GAME CONTROL BAR -->
<div class="game-control-bar">
<div style="display:flex;align-items:center;gap:10px">
<div class="dice-box" id="diceDisplay">🎲</div>
<button class="btn-roll" onclick="rollDice()">ROLL DICE</button>
</div>
<div style="font-size:0.7rem;color:#94a3b8" id="turnIndicator">Room: Not Joined</div>
</div>

<!-- BOTTOM NAVIGATION BAR -->
<div class="bottom-nav">
<button class="nav-item active" onclick="switchTab('game')"><span>🎮</span>Game</button>
<button class="nav-item" onclick="openModal('roomModal')"><span>🏠</span>Rooms</button>
<button class="nav-item" onclick="openModal('shopModal')"><span>🛍️</span>Store</button>
<button class="nav-item" onclick="openModal('authModal')"><span>👤</span>Profile</button>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="modal">
<h3 style="color:#38bdf8;margin-bottom:15px">🔐 Yalla Pro ID Center</h3>
<input type="email" id="authEmail" class="auth-input" placeholder="Email Address">
<input type="password" id="authPass" class="auth-input" placeholder="Password">
<button class="btn-roll" style="width:100%;margin-bottom:10px;" onclick="handleAuth('signin')">LOGIN</button>
<button class="btn-roll" style="width:100%;margin-bottom:15px;background:#10b981;color:#fff;" onclick="handleAuth('signup')">CREATE ACCOUNT</button>
<button class="btn-roll" style="width:100%;background:#334155;color:#fff;" onclick="closeModal('authModal')">CLOSE</button>
</div>

<!-- ROOM MODAL -->
<div id="roomModal" class="modal">
<h3 style="color:#38bdf8;margin-bottom:15px">🏠 Online Multiplayer Rooms</h3>
<input type="text" id="roomInput" class="auth-input" placeholder="Enter Room ID (e.g. 7788)">
<button class="btn-roll" style="width:100%;margin-bottom:15px;" onclick="joinRoomModal()">JOIN TABLE</button>
<button class="btn-roll" style="width:100%;background:#334155;color:#fff;" onclick="closeModal('roomModal')">CLOSE</button>
</div>

<!-- STORE MODAL -->
<div id="shopModal" class="modal">
<h3 style="color:#fbbf24;margin-bottom:15px">🛍️ VIP Store & Rewards</h3>
<div style="background:#1e293b;padding:15px;border-radius:16px;width:100%;margin-bottom:15px;border:1px solid #334155;">
<p style="color:#fbbf24;font-weight:bold;margin-bottom:5px">Daily Bonus Pack</p>
<p style="font-size:0.75rem;color:#94a3b8;margin-bottom:10px">Claim free daily coins and gems.</p>
<button class="btn-roll" style="width:100%;background:#10b981;color:#fff" onclick="claimBonus()">CLAIM 2,000 COINS</button>
</div>
<button class="btn-roll" style="width:100%;background:#334155;color:#fff;" onclick="closeModal('shopModal')">CLOSE</button>
</div>

</div>

<!-- FIREBASE & GAME LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAL7_6DTdz14ySlLQ1jjuQC4WdO4mpRZKY",
  authDomain: "shopping-center-9.firebaseapp.com",
  databaseURL: "https://shopping-center-9-default-rtdb.firebaseio.com",
  projectId: "shopping-center-9",
  storageBucket: "shopping-center-9.firebasestorage.app",
  messagingSenderId: "33427127023",
  appId: "1:33427127023:web:a478af6499f28f84d9391a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentRoomId = null;
let myColor = null;

window.handleAuth = function(type) {
  let email = document.getElementById('authEmail').value;
  let pass = document.getElementById('authPass').value;
  if(!email || !pass) { alert('Enter credentials'); return; }
  
  if(type === 'signup') {
    createUserWithEmailAndPassword(auth, email, pass).then((res) => {
      alert('Account Created Successfully!');
      closeModal('authModal');
    }).catch(e => alert(e.message));
  } else {
    signInWithEmailAndPassword(auth, email, pass).then((res) => {
      alert('Login Successful!');
      closeModal('authModal');
    }).catch(e => alert(e.message));
  }
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('userNameDisplay').innerText = user.email.split('@')[0];
    document.getElementById('userAvatar').innerText = user.email[0].toUpperCase();
  } else {
    document.getElementById('userNameDisplay').innerText = "Guest Player";
    document.getElementById('userAvatar').innerText = "YP";
  }
});

window.claimBonus = function() {
  let coinsEl = document.getElementById('coinsCount');
  let current = parseInt(coinsEl.innerText.replace(',', '')) + 2000;
  coinsEl.innerText = current.toLocaleString();
  alert('Successfully claimed +2,000 Coins!');
  closeModal('shopModal');
}

// Ludo Engine
const mainTrack = [
[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],
[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],
[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],
[7,0],[6,0]
];
const safeIndices=[0,8,13,21,26,34,39,47];
const baseCoords={ red:[[1,1],[1,4],[4,1],[4,4]], yellow:[[10,10],[10,13],[13,10],[13,13]] };
const startIndices={ red:0, yellow:26 };

function globalTrackIndex(color, progress){ return (startIndices[color] + progress) % 52; }

window.initBoard = function(){
  const board = document.getElementById('ludoBoard');
  board.innerHTML = '';
  for(let r=0; r<15; r++){
    for(let c=0; c<15; c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      if(r<6 && c<6) cell.classList.add('red-base');
      else if(r>8 && c>8) cell.classList.add('yellow-base');
      let trackIndex = mainTrack.findIndex(([tr, tc]) => tr === r && tc === c);
      if(trackIndex >= 0 && safeIndices.includes(trackIndex)){
        cell.classList.add('safe'); cell.innerText = '⭐';
      }
      if(r>=6 && r<=8 && c>=6 && c<=8) cell.classList.add('center-home');
      board.appendChild(cell);
    }
  }
}

window.joinRoomModal = function(){
  const roomId = document.getElementById('roomInput').value.trim();
  if(!roomId){ alert('Enter Room ID'); return; }
  currentRoomId = roomId;
  document.getElementById('turnIndicator').innerText = `Room: ${roomId}`;
  closeModal('roomModal');

  const roomRef = ref(db, 'ludo_rooms/' + roomId);
  onValue(roomRef, (snapshot) => {
    const data = snapshot.val();
    if(!data){
      set(roomRef, { turn: 'red', dice: 1, pawns: { red: [-1,-1,-1,-1], yellow: [-1,-1,-1,-1] } });
      myColor = 'red';
    } else {
      if(!myColor) myColor = data.pawns.yellow.some(p => p !== -1) ? 'yellow' : 'red';
      updateBoardState(data);
    }
  });
}

function updateBoardState(data){
  document.querySelectorAll('.pawn').forEach(el => el.remove());
  document.getElementById('diceDisplay').innerText = data.dice || '🎲';

  if(data.pawns){
    ['red', 'yellow'].forEach(color => {
      data.pawns[color].forEach((progress, idx) => {
        let coords = progress === -1 ? baseCoords[color][idx] : mainTrack[globalTrackIndex(color, progress)];
        if(coords){
          let cell = document.querySelector(`[data-row='${coords[0]}'][data-col='${coords[1]}']`);
          if(cell){
            let p = document.createElement('div');
            p.className = `pawn pawn-${color}`;
            p.onclick = () => handlePawnClick(color, idx, data);
            cell.appendChild(p);
          }
        }
      });
    });
  }
}

window.rollDice = function(){
  if(!currentRoomId) { alert('Please join a room first via Rooms tab!'); return; }
  let val = Math.floor(Math.random() * 6) + 1;
  update(ref(db, 'ludo_rooms/' + currentRoomId), { dice: val });
}

window.handlePawnClick = function(color, idx, data){
  if(color !== myColor || data.turn !== myColor) return;
  let diceVal = data.dice || 1;
  let p = data.pawns[color][idx];
  if((p === -1 && diceVal === 6) || (p >= 0 && p + diceVal < 52)){
    let newPos = p === -1 ? startIndices[color] : p + diceVal;
    let updatedPawns = data.pawns;
    updatedPawns[color][idx] = newPos;
    let nextTurn = diceVal === 6 ? myColor : (myColor === 'red' ? 'yellow' : 'red');
    update(ref(db, 'ludo_rooms/' + currentRoomId), { pawns: updatedPawns, turn: nextTurn });
  }
}

window.openModal = function(id) { document.getElementById(id).style.display = 'flex'; }
window.closeModal = function(id) { document.getElementById(id).style.display = 'none'; }
window.switchTab = function(tab) {}

initBoard();
</script>
</body>
</html>
