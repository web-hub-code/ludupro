<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yalla Pro Ludo Arena - Real AI Bot Edition</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#2a3654;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:5px}
.app-container{width:100%;max-width:420px;background:linear-gradient(135deg,#3b4a6b 0%,#24304d 100%);border:3px solid #64748b;border-radius:24px;box-shadow:0 25px 50px rgba(0,0,0,.9);padding:10px;text-align:center;position:relative;overflow:hidden;height:100vh;max-height:820px;display:flex;flex-direction:column;justify-content:space-between}

.top-header{display:flex;justify-content:space-between;align-items:center;background:rgba(15,23,42,0.6);padding:6px 12px;border-radius:14px;border:1px solid rgba(255,255,255,0.1)}
.icon-btn{background:rgba(255,255,255,0.1);border:none;width:32px;height:32px;border-radius:50%;color:#fff;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:0.9rem}
.spectator-pill{background:rgba(0,0,0,0.3);padding:4px 12px;border-radius:12px;font-size:0.75rem;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,0.05)}

.players-top{display:flex;justify-content:space-between;padding:0 4px}
.player-card{display:flex;align-items:center;gap:6px;background:rgba(15,23,42,0.5);padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.08)}
.player-avatar{width:32px;height:32px;border-radius:50%;background:#475569;border:2px solid #fbbf24;display:flex;justify-content:center;align-items:center;font-size:0.7rem;font-weight:bold}
.player-name{font-size:0.7rem;color:#e2e8f0;text-align:left}

.board-wrapper{width:100%;aspect-ratio:1;background:#fff;border:6px solid #475569;border-radius:12px;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);box-shadow:0 10px 30px rgba(0,0,0,0.6);position:relative}
.cell{display:flex;justify-content:center;align-items:center;position:relative;font-size:0.4rem;border:0.5px solid #cbd5e1}
.cell.red-base{background:#ef4444}
.cell.yellow-base{background:#f59e0b}
.cell.safe{background:#f1f5f9}
.cell.center-home{background:linear-gradient(135deg,#6366f1 50%,#3b82f6 50%)}

.pawn{width:75%;height:75%;border-radius:50%;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.5);border:2px solid #fff;z-index:10}
.pawn-red{background:radial-gradient(circle at 30% 30%,#f87171,#dc2626)}
.pawn-yellow{background:radial-gradient(circle at 30% 30%,#facc15,#d97706)}

.players-bottom{display:flex;justify-content:space-between;padding:0 4px;align-items:center}
.dice-container{display:flex;align-items:center;gap:8px}
.dice-box{font-size:1.6rem;background:#1e293b;width:42px;height:42px;border-radius:12px;display:flex;justify-content:center;align-items:center;border:2px solid #38bdf8;color:#38bdf8;cursor:pointer}

.bottom-action-bar{display:flex;justify-content:space-around;background:rgba(15,23,42,0.8);padding:8px;border-radius:16px;border:1px solid rgba(255,255,255,0.1)}
.action-icon-btn{width:42px;height:42px;border-radius:50%;background:#334155;border:none;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;justify-content:center;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,0.3)}

.modal{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(11,15,25,0.95);backdrop-filter:blur(15px);border-radius:24px;z-index:300;padding:20px;flex-direction:column;justify-content:center;align-items:center}
.auth-input{width:100%;padding:10px;margin-bottom:10px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;font-size:0.9rem}

@keyframes flyUp {
  0% { transform: translateY(0) scale(0.4); opacity: 0; }
  50% { opacity: 1; transform: translateY(-160px) scale(1.2); }
  100% { transform: translateY(-320px) scale(1); opacity: 0; }
}
.flying-asset { position: absolute; font-size: 2.8rem; animation: flyUp 1.5s ease-in-out forwards; z-index: 400; pointer-events: none; }
</style>
</head>
<body>

<div class="app-container" id="appContainer">

<!-- Top Header -->
<div class="top-header">
<button class="icon-btn" onclick="openModal('modeModal')">🤖</button>
<button class="icon-btn" onclick="openModal('vipModal')">🏆</button>
<div class="spectator-pill">👁️ Spectator <span>1</span></div>
<button class="icon-btn" onclick="openModal('giftModal')">🎁</button>
</div>

<!-- Top Players Bar -->
<div class="players-top">
<div class="player-card">
<div class="player-avatar" style="background:#3b82f6">AI</div>
<div class="player-name">Computer Bot<br><span style="font-size:0.55rem;color:#f59e0b" id="botStatus">Waiting...</span></div>
</div>
<div class="player-card">
<div class="player-avatar" style="background:#ef4444">SB</div>
<div class="player-name">salim ben...<br><span style="font-size:0.55rem;color:#10b981">🎙️ Active</span></div>
</div>
</div>

<!-- Classic Ludo Board -->
<div class="board-wrapper" id="ludoBoard"></div>

<!-- Bottom Players Bar + Dice -->
<div class="players-bottom">
<div class="player-card">
<div class="player-avatar" style="background:#f59e0b">NK</div>
<div class="player-name">Nazim_khan (You)<br><span style="font-size:0.55rem;color:#fbbf24" id="turnIndicator">Your Turn</span></div>
</div>

<div class="dice-container">
<div class="dice-box" id="diceDisplay" onclick="rollDice()">🎲</div>
</div>

<div class="player-card">
<div class="player-avatar" style="background:#10b981">GR</div>
<div class="player-name">Green VIP<br><span style="font-size:0.55rem;color:#10b981">🎙️ Active</span></div>
</div>
</div>

<!-- Bottom Action Bar -->
<div class="bottom-action-bar">
<button class="action-icon-btn" onclick="toggleMainMic(this)">🎙️</button>
<button class="action-icon-btn" onclick="openModal('giftModal')">🎁</button>
<button class="action-icon-btn" onclick="openModal('modeModal')">🤖</button>
<button class="action-icon-btn" onclick="openModal('authModal')">👤</button>
</div>

<!-- MODALS -->
<div id="modeModal" class="modal">
<h3 style="color:#38bdf8;margin-bottom:15px">🤖 Game Mode Selection</h3>
<p style="font-size:0.8rem;color:#94a3b8;margin-bottom:15px">Play offline against smart computer AI bot.</p>
<button style="width:100%;padding:12px;margin-bottom:10px;background:#10b981;color:#fff;font-weight:bold;border:none;border-radius:10px;cursor:pointer;" onclick="startAIMatch()">START AI BOT MATCH</button>
<button style="width:100%;padding:10px;background:#334155;color:#fff;border:none;border-radius:8px;cursor:pointer;" onclick="closeModal('modeModal')">CLOSE</button>
</div>

<div id="giftModal" class="modal">
<h3 style="color:#fbbf24;margin-bottom:15px">🎁 Luxury Animated Gifts</h3>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-bottom:15px">
<div style="background:#1e293b;padding:12px;border-radius:12px;cursor:pointer;font-size:1.8rem" onclick="sendLuxuryGift('🏎️')">🏎️<br><span style="font-size:0.5rem">Car</span></div>
<div style="background:#1e293b;padding:12px;border-radius:12px;cursor:pointer;font-size:1.8rem" onclick="sendLuxuryGift('🚀')">🚀<br><span style="font-size:0.5rem">Rocket</span></div>
<div style="background:#1e293b;padding:12px;border-radius:12px;cursor:pointer;font-size:1.8rem" onclick="sendLuxuryGift('👑')">👑<br><span style="font-size:0.5rem">Crown</span></div>
</div>
<button style="width:100%;padding:10px;background:#334155;color:#fff;border:none;border-radius:8px;cursor:pointer;" onclick="closeModal('giftModal')">CLOSE</button>
</div>

<div id="authModal" class="modal">
<h3 style="color:#38bdf8;margin-bottom:15px">🔐 Account Login</h3>
<input type="email" id="authEmail" class="auth-input" placeholder="Email Address">
<input type="password" id="authPass" class="auth-input" placeholder="Password">
<button style="width:100%;padding:10px;margin-bottom:8px;background:#38bdf8;color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;" onclick="submitEmailAuth('signin')">LOGIN</button>
<button style="width:100%;padding:10px;margin-bottom:8px;background:#10b981;color:#fff;font-weight:bold;border:none;border-radius:8px;cursor:pointer;" onclick="submitEmailAuth('signup')">SIGN UP</button>
<button style="width:100%;padding:10px;background:#334155;color:#fff;border:none;border-radius:8px;cursor:pointer;" onclick="closeModal('authModal')">CLOSE</button>
</div>

</div>

<script>
let localPawns = { red: [-1,-1,-1,-1], yellow: [-1,-1,-1,-1] };
let localDice = 1;
let localTurn = 'red'; // 'red' = You, 'yellow' = AI Bot

window.openModal = function(id) { document.getElementById(id).style.display = 'flex'; }
window.closeModal = function(id) { document.getElementById(id).style.display = 'none'; }

window.toggleMainMic = function(btn) {
  btn.style.background = btn.style.background === 'rgb(239, 68, 68)' ? '#334155' : '#ef4444';
}

window.sendLuxuryGift = function(symbol) {
  closeModal('giftModal');
  let container = document.getElementById('appContainer');
  let el = document.createElement('div');
  el.className = 'flying-asset';
  el.innerText = symbol;
  el.style.left = `${Math.random() * 70 + 15}%`;
  el.style.bottom = '120px';
  container.appendChild(el);
  if(typeof confetti === 'function') confetti({particleCount: 100, spread: 70, origin: {y: 0.5}});
  setTimeout(() => el.remove(), 1500);
}

const mainTrack = [
[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],
[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],
[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],
[7,0],[6,0]
];
const safeIndices=[0,8,13,21,26,34,39,47];
const baseCoords={ red:[[1,1],[1,4],[4,1],[4,4]], yellow:[[10,10],[10,13],[13,10],[13,13]] };
const startIndices={ red:0, yellow:26 };

function globalTrackIndex(color, progress){ return (startIndices[color] + progress) % 52; }

window.initBoard = function(){
  const board = document.getElementById('ludoBoard');
  board.innerHTML = '';
  for(let r=0; r<15; r++){
    for(let c=0; c<15; c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      if(r<6 && c<6) cell.classList.add('red-base');
      else if(r>8 && c>8) cell.classList.add('yellow-base');
      else if(r>=6 && r<=8 && c>=6 && c<=8) cell.classList.add('center-home');
      
      let trackIndex = mainTrack.findIndex(([tr, tc]) => tr === r && tc === c);
      if(trackIndex >= 0 && safeIndices.includes(trackIndex)){
        cell.classList.add('safe'); cell.innerText = '★';
      }
      board.appendChild(cell);
    }
  }
  renderBoard();
}

window.startAIMatch = function() {
  localPawns = { red: [-1,-1,-1,-1], yellow: [-1,-1,-1,-1] };
  localTurn = 'red';
  localDice = 1;
  closeModal('modeModal');
  alert('AI Bot Match Started! You are Red.');
  renderBoard();
}

window.rollDice = function(){
  if(localTurn !== 'red') return;
  localDice = Math.floor(Math.random() * 6) + 1;
  renderBoard();
}

function renderBoard() {
  document.querySelectorAll('.pawn').forEach(el => el.remove());
  document.getElementById('diceDisplay').innerText = localDice;
  document.getElementById('turnIndicator').innerText = localTurn === 'red' ? "Your Turn" : "Bot Playing...";
  document.getElementById('botStatus').innerText = localTurn === 'yellow' ? "Rolling..." : "Waiting";

  ['red', 'yellow'].forEach(color => {
    localPawns[color].forEach((progress, idx) => {
      let coords = progress === -1 ? baseCoords[color][idx] : mainTrack[globalTrackIndex(color, progress)];
      if(coords){
        let cell = document.querySelector(`[data-row='${coords[0]}'][data-col='${coords[1]}']`);
        if(cell){
          let p = document.createElement('div');
          p.className = `pawn pawn-${color}`;
          if(color === 'red') {
            p.onclick = () => handlePawnClick(color, idx);
          }
          cell.appendChild(p);
        }
      }
    });
  });
}

function handlePawnClick(color, idx) {
  if(localTurn !== 'red' || color !== 'red') return;
  let p = localPawns[color][idx];
  if((p === -1 && localDice === 6) || (p >= 0 && p + localDice < 52)){
    localPawns[color][idx] = p === -1 ? startIndices['red'] : p + localDice;
    localTurn = localDice === 6 ? 'red' : 'yellow';
    renderBoard();

    if(localTurn === 'yellow') {
      runAiBotTurn();
    }
  }
}

function runAiBotTurn() {
  setTimeout(() => {
    localDice = Math.floor(Math.random() * 6) + 1;
    renderBoard();

    setTimeout(() => {
      // Find valid yellow pawn to move
      let validIndices = [];
      localPawns.yellow.forEach((pos, i) => {
        if((pos === -1 && localDice === 6) || (pos >= 0 && pos + localDice < 52)) {
          validIndices.push(i);
        }
      });

      if(validIndices.length > 0) {
        let chosenIdx = validIndices[Math.floor(Math.random() * validIndices.length)];
        let p = localPawns.yellow[chosenIdx];
        localPawns.yellow[chosenIdx] = p === -1 ? startIndices['yellow'] : p + localDice;
      }

      localTurn = localDice === 6 ? 'yellow' : 'red';
      renderBoard();

      // If bot rolled 6, it gets another turn automatically
      if(localTurn === 'yellow') {
        runAiBotTurn();
      }
    }, 1000);
  }, 1000);
}

initBoard();
</script>
</body>
</html>
